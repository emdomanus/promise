name = "emdomanus/promise"
version = "0.1.0"
description = "Small typed promise primitive for Roblox and Luau."
license = "Proprietary"
authors = ["emdomanus"]
repository = "https://github.com/emdomanus/promise"
private = true

includes = ["pesde.toml", "LICENSE", "README.md", "src/**/*.luau"]

[target]
environment = "roblox"
lib = "src/components/promise/shared/promise.luau"
build_files = ["src"]

[indices]
default = "https://github.com/pesde-pkg/index"
